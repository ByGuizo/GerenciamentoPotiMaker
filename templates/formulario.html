{% extends "base.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
    <section class="cartao estreito surgir">
        <div class="cartao-topo topo-preto">
            <h1><i class="fa-solid fa-pen-to-square"></i> {{ titulo }}</h1>
        </div>
        <form method="post" class="cartao-corpo formulario">
            {% csrf_token %}
            {{ form.as_div }}
            <div class="barra-salvar">
                <a class="botao botao-branco" href="{{ voltar_url }}"><i class="fa-solid fa-xmark"></i> Cancelar</a>
                <button type="submit" class="botao botao-verde"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
            </div>
        </form>
    </section>
{% endblock %}
